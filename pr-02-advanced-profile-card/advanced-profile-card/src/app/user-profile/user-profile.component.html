<div class="profile-card">
  <h2>{{ user.name }}</h2>

  <p><strong>ID:</strong> {{ user.id }}</p>
  <p><strong>Status:</strong> {{ user.status }}</p>

  <h3>Address</h3>
  <p>{{ user.address.city }}, {{ user.address.street }}</p>

  <h3>Hobbies ({{ getHobbiesCount() }})</h3>
  <ul>
    <li *ngFor="let hobby of user.hobbies">
      {{ hobby }}
    </li>
  </ul>
</div>
