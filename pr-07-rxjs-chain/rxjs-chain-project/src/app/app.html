<h2>Користувачі</h2>

<ul>
  <li *ngFor="let user of users"
      (click)="selectUser(user.id)"
      style="cursor: pointer; margin-bottom: 5px;">
    {{ user.name }}
  </li>
</ul>

<hr>

<h2>Пости обраного користувача</h2>

<ul>
  <li *ngFor="let post of posts">
    <strong>{{ post.title }}</strong>
    <p>{{ post.body }}</p>
  </li>
</ul>
