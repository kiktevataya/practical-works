<p>{{ question?.text }}</p>

<ul>
  <li *ngFor="let option of question?.options"
      (click)="selectAnswer(option)"
      [style.background]="option === highlightedAnswer ? '#ccffcc' : 'white'"
      style="cursor: pointer; padding: 6px; border: 1px solid #ccc; margin-bottom: 5px;">

    {{ option }}
  </li>
</ul>
